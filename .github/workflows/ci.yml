name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: dependency audit (packages that ship in dist)
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - name: build
        run: npm run build
      - name: committed dist/ is up to date
        run: git diff --exit-code -- dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Chrome browser tests (including the 100,000-file test)
        env:
          CI: 'true'
          FSB_E2E_BIG: '1'
          FSB_E2E_SKIP_SAFARI: '1'
        run: node --test --test-reporter=spec e2e/chrome.test.mjs
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Short runs on every push; the seed corpora also run as ordinary tests above.
      # Run them longer locally: go test ./internal/guard -run '^$' -fuzz FuzzGuardNeverExposesSecrets -fuzztime 5m
      - name: fuzz the path guard (secrets must never surface)
        run: go test ./internal/guard -run '^$' -fuzz '^FuzzGuardNeverExposesSecrets$' -fuzztime 30s
      - name: fuzz the rule matcher
        run: |
          go test ./internal/rules -run '^$' -fuzz '^FuzzDenyMatchesEverythingUnderADeniedDirectory$' -fuzztime 15s
          go test ./internal/rules -run '^$' -fuzz '^FuzzParseAndMatch$' -fuzztime 15s
      - name: fuzz the HTTP guard
        run: |
          go test ./internal/httpguard -run '^$' -fuzz '^FuzzMiddlewareOnlyAdmitsLegitimateRequests$' -fuzztime 20s
          go test ./internal/httpguard -run '^$' -fuzz '^FuzzLaunchTokenCannotBeReplayedOrMisplaced$' -fuzztime 10s
      - name: fuzz the whole server stack
        run: go test ./internal/server -run '^$' -fuzz '^FuzzPathParameter$' -fuzztime 30s
      - name: keep any failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
