name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to reviewed commits (the version is in each comment),
# Node and govulncheck to exact versions, and runners to named images (not
# -latest, which moves on its own), so a run is reproducible without upkeep.
# Update them by hand, deliberately. Every job has a time limit: GitHub's
# default is six hours, and a hung Chrome launch once held the e2e job open.

jobs:
  test:
    strategy:
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race ./...
      - name: every test the specs cite exists
        if: runner.os == 'Linux'
        run: python3 specs/tools/check-traceability.py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The whole graph: Svelte and Vite are dev dependencies, yet Svelte's runtime
      # is compiled into dist and Vite builds it.
      - name: dependency audit
        run: npm audit --audit-level=high
      - run: npm test
      - name: typecheck (app and tests)
        run: npm run check
      - name: build
        run: npm run build
      - name: committed dist/ is up to date
        run: git diff --exit-code -- dist

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: a failed Chrome launch leaves no Chrome behind
        run: node --test --test-reporter=spec e2e/launch.test.mjs
      - name: Chrome browser tests (including the 100,000-file test)
        env:
          CI: 'true'
          FSB_E2E_BIG: '1'
          FSB_E2E_SKIP_SAFARI: '1'
        run: node --test --test-reporter=spec e2e/chrome.test.mjs
      - name: Another user cannot use the launch URL (two real users)
        run: |
          go build -o "$RUNNER_TEMP/bin/fsb" ./cmd/fsb
          PATH="$RUNNER_TEMP/bin:$PATH" e2e/linux/crossuser.sh --host
      - name: Keep screenshots of failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Short runs on every push; the seed corpora also run as ordinary tests above.
      # Run them longer locally: go test ./internal/guard -run '^$' -fuzz FuzzGuardNeverExposesSecrets -fuzztime 5m
      - name: fuzz the path guard (secrets must never surface)
        run: go test ./internal/guard -run '^$' -fuzz '^FuzzGuardNeverExposesSecrets$' -fuzztime 30s
      - name: fuzz the zip directory reader (agrees with archive/zip)
        run: go test ./internal/guard -run '^$' -fuzz '^FuzzListZipAgreesWithArchiveZip$' -fuzztime 20s
      - name: fuzz the rule matcher
        run: |
          go test ./internal/rules -run '^$' -fuzz '^FuzzDenyMatchesEverythingUnderADeniedDirectory$' -fuzztime 15s
          go test ./internal/rules -run '^$' -fuzz '^FuzzParseAndMatch$' -fuzztime 15s
      - name: fuzz the HTTP guard
        run: |
          go test ./internal/httpguard -run '^$' -fuzz '^FuzzMiddlewareOnlyAdmitsLegitimateRequests$' -fuzztime 20s
          go test ./internal/httpguard -run '^$' -fuzz '^FuzzLaunchTokenCannotBeReplayedOrMisplaced$' -fuzztime 10s
      - name: fuzz the whole server stack
        run: go test ./internal/server -run '^$' -fuzz '^FuzzPathParameter$' -fuzztime 30s
      - name: keep any failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore

  vuln:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck checks only the code built for its GOOS, so scan each platform
      # fsb supports; the darwin-only files are otherwise never checked. It is
      # installed first because GOOS on `go run` would build it for darwin too.
      - name: install govulncheck
        run: GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: govulncheck (linux)
        run: GOOS=linux "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: govulncheck (darwin)
        run: GOOS=darwin "$RUNNER_TEMP/bin/govulncheck" ./...
