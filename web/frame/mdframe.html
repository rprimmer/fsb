<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Markdown</title>
<style>
:root { color-scheme: light dark; --fg: #1f2328; --bg: #ffffff; --muted: #656d76; --line: #d8dee4; --code: #f6f8fa; --link: #0969da; }
@media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --bg: #0d1117; --muted: #8d96a0; --line: #30363d; --code: #161b22; --link: #58a6ff; } }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.md { padding: 12px 16px; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2 { border-bottom: 1px solid var(--line); padding-bottom: 0.25em; }
.md h1 { font-size: 1.6em; } .md h2 { font-size: 1.3em; } .md h3 { font-size: 1.1em; }
.md code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); padding: 0.15em 0.35em; border-radius: 4px; }
.md pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md pre.rawhtml { border: 1px dashed var(--line); color: var(--muted); }
.md blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: 3px solid var(--line); }
.md table { border-collapse: collapse; margin: 0.6em 0; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 10px; }
.md th { background: var(--code); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md a[data-fsb] { color: var(--link); cursor: pointer; text-decoration: underline; }
.md a[data-fsb="external"]::after { content: " \2197"; font-size: 0.85em; }
.md a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.md .noimg { color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 0 6px; font-size: 0.9em; }
.md img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<article id="md" class="md"></article>
<script>
(function () {
  var root = document.getElementById('md');
  // Only the app that framed us may send content, and it sends HTML it has already
  // sanitized. This page's policy still forbids scripts, handlers and any network
  // access, so even markup that slipped through could not do anything.
  window.addEventListener('message', function (e) {
    if (e.source !== parent) return;
    var d = e.data;
    if (!d || d.type !== 'fsb-md-render' || typeof d.html !== 'string') return;
    root.innerHTML = d.html;
    // Layout facts let the app (and its browser tests) locate links without
    // reaching into this frame.
    var links = [].map.call(root.querySelectorAll('a[data-fsb]'), function (a) {
      var r = a.getBoundingClientRect();
      return { kind: a.getAttribute('data-fsb'), href: a.getAttribute('data-href'), x: r.left, y: r.top, w: r.width, h: r.height };
    });
    parent.postMessage({
      type: 'fsb-md-ready',
      text: root.innerText.slice(0, 4000),
      links: links,
      images: root.querySelectorAll('img[src]').length
    }, '*');
  });
  function send(a) {
    parent.postMessage({ type: 'fsb-md-link', kind: a.getAttribute('data-fsb'), href: a.getAttribute('data-href') }, '*');
  }
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[data-fsb]') : null;
    if (a) { e.preventDefault(); send(a); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var a = document.activeElement;
    if (a && a.matches && a.matches('a[data-fsb]')) { e.preventDefault(); send(a); }
  });
})();
</script>
</body>
</html>
